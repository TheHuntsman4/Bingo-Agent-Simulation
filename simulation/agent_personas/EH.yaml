alumni_status: Alumni!
current_challenges: If there's any federal employees or ex-feds in the alumni community,
  I'd LOVE to chat with them about the current climate in the executive branch. If
  anyone's been through any layoffs, I'd also love to hear their stories about what
  they decided to do next!
expertise_areas: Again any and all things aviation - both from the pilot and controller
  side of things! If anyone's curious about how to get started in the aviation industry,
  life as a federal employee, or simply a thought they had while passing through an
  airport, I'd be glad to answer!
interests_and_hobbies: Aviation is a big one! As a pilot, I've flown all over the
  southwest - from Pasadena to Las Vegas to Sedona to Monument Valley and dealt with
  a couple of life-or-death scenarios, including a fuel leak mid-air and a runway
  excursion that threw the aircraft off the runway at nearly 80mph. As an air traffic
  controller, I've worked nearly all of Mississippi's airspace and dealt with nearly
  everything under the sun! Apart from that, video games (Fortnite, Age of Empires,
  Halo) and train rides (shoutout to the Amtrak Rail Pass!) are a lot of how I spend
  my free time.
personal_goals: Networking and meeting up with old friends, mostly!
