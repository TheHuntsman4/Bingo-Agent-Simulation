ID: AK
alumni_status: Alumni!
current_challenges: How do people go about effectively managing their time? There's
  so much I want to do that I sometimes feel overwhelmed when trying to tackle any
  of it. Especially with a full time job and the responsibilities of modern day-to-day
  adulthood, sometimes it feels like there isn't enough time in the day.
expertise_areas: "I'm always happy to share any advice that people might find helpful,\
  \ whether it's career-related, school-related, life-related, etc. I may not be all\
  \ that qualified to give advice on some of these things, but there's a lot of value\
  \ in sharing experiences with each other so that people understand that everybody\
  \ has their own path with unique challenges. There is support and guidance if you're\
  \ willing to seek it!\r\n\r\nIf there's specific questions around trying to succeed\
  \ as an undergraduate student or finding early career jobs/internships, I might\
  \ be able to help with that."
interests_and_hobbies: "I'm kind of an aviation nerd, it's something I've been passionate\
  \ about for as long as I can remember. I flew a plane for the first time last year\
  \ and it was one of the best experiences I've had. \r\n\r\nI love learning about\
  \ history in my free time, and have spent a lot of time researching the Second World\
  \ War. Last year I had the chance to speak to two WW2 combat veterans, both of whom\
  \ were over 100 years old.\r\n\r\nRecently I've gotten really interested in 35mm\
  \ film photography and fixed up my family's old film cameras. I'm still pretty much\
  \ a novice, but I'm having a great time learning and improving with each roll of\
  \ film that I go through!\r\n\r\nI'm always ready to chat about sports (especially\
  \ Bay Area sports teams)!"
personal_goals: "I'm getting back into the job search grind. It's always nice to have\
  \ others to talk to about this. It's valuable to discuss goals, experiences, advice,\
  \ and trends we are noticing as we try to navigate this environment.\r\n\r\nI'm\
  \ hoping to start traveling more, and it would be great to see what advice people\
  \ have in this area.\r\n\r\nIf there's anyone else who has completed or is pursuing\
  \ flight lessons, it would be fun to talk to them too!"
unique_facts: I rode on the world's fastest roller coaster in the world (pulled over
  4.5Gs), and the experience put me off of amusement parks for nearly 10 years. I've
  been easing back into it recently though!
